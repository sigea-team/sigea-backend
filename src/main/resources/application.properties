spring.application.name=demosigea-backend

# ===================================
# CONEXIÓN A BASE DE DATOS NEON (POSTGRESQL)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/neondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ===================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================
# CONFIGURACIÓN DE CORREO BREVO API (REST)
# ===================================
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# ===================================
# PARÁMETROS DEL SISTEMA SIGEA
# ===================================
app.mail.from=${APP_MAIL_FROM:sigeaufps@gmail.com}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:SIGEA - Notificaciones}

# URL del Backend en Railway (se usa para el enlace GET directo de verificación de correo)
app.mail.backend-url=${APP_BACKEND_URL:http://localhost:8080}
app.mail.frontend-url=${APP_FRONTEND_URL:http://localhost:8080}
app.mail.verification-path=/api/v1/auth/verify-email

# HU-32: URL base del FRONTEND en GitHub Pages (donde está alojado tu React)
app.mail.reset-password-base-url=${APP_RESET_PASSWORD_BASE_URL:http://localhost:5173/#}
# HU-32: ruta de la página (frontend) donde el usuario escribe su nueva contraseña
app.mail.reset-password-path=/reset-password
# HU-32: horas de vigencia del token de recuperación
app.mail.reset-token-expiration-hours=1

# ===================================
# SEGURIDAD Y JWT
# ===================================
app.jwt.secret=${JWT_SECRET:dGVtcG9yYXJ5LXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LXB1cnBvc2VzLW9ubHk=}
app.jwt.expiration-ms=86400000
app.roles.default-initial=PARTICIPANTE

app.security.max-intentos-fallidos=${MAX_INTENTOS_FALLIDOS:5}
app.security.minutos-bloqueo=${MINUTOS_BLOQUEO:15}